# =============================================================================
# LCA INPUT DATA  --  anti-leak film material comparison
# =============================================================================
# THIS FILE IS THE ONLY PLACE NUMBERS LIVE.
# Edit values here; never edit the calculation code to change an input.
#
# Every numeric input MUST carry a `confidence` tag. Allowed values:
#
#   "literature"  Literature-backed. Traceable to a published LCA, eco-profile,
#                 EPD or peer-reviewed paper. `source` is mandatory.
#   "derived"     Derived by calculation in this model from stoichiometry or
#                 composition. `derivation` is mandatory and is re-checked by
#                 the test suite, so these numbers cannot silently drift.
#   "estimate"    Industry-typical estimate. Defensible order of magnitude from
#                 general engineering knowledge, but not traced to a source.
#   "placeholder" PLACEHOLDER, NEEDS A SOURCE. No credible published figure was
#                 found. Any result that consumes one is flagged.
#
# Every raw-material input MUST also carry a `boundary`. Mixing boundaries is
# the single easiest way to produce a wrong comparison, so the model tracks it
# and warns rather than trusting the author to remember. Allowed values:
#
#   "factory_gate" Cradle to factory gate. Unpacked material at production site
#                  out. No packaging, storage, retail transport or land-use
#                  change. This is the PlasticsEurope eco-profile declared unit
#                  and the study's target boundary.
#   "retail_shelf" Cradle to retail shelf. Includes packaging, storage, retail
#                  transport AND land-use change / deforestation. This is the
#                  CarbonCloud food-ingredient boundary. WIDER than the target:
#                  values on this boundary are biased HIGH relative to a
#                  factory-gate figure and are not like-for-like comparable.
#   "process"      Gate-to-gate conversion step.
#   "eol"          End of life.
#
# `low` / `high` bound the plausible range and drive the sensitivity report.
# Where a range is very wide, that IS the finding -- do not narrow it to look
# tidier than the evidence is.
#
# `[scenarios.*]` at the bottom define named override sets. Run one with
#   python3 -m lca_film --scenario <name>
# Nothing in lca_film/ needs to change to add, edit or remove a scenario.
# =============================================================================

[meta]
title            = "Cradle-to-grave GHG comparison: sanitary product anti-leak film"
functional_unit  = "1 kg of finished film material"
boundary         = "Cradle to grave: raw material acquisition + production, film forming, biogenic carbon uptake, end of life. Excludes converting, distribution, and use phase, which are assumed equivalent across the three candidates."
target_boundary  = "factory_gate"
gwp_method       = "GWP100, IPCC AR6"
prepared         = "2026 reconstruction of a 2023 project. Original process data is NOT available; all figures are representative published values, tagged by confidence."

[constants]
# Molar masses (g/mol) used by the biogenic-carbon and stoichiometric routines.
m_c   = 12.011
m_co2 = 44.009
m_ch4 = 16.043
# GWP100 of biogenic (non-fossil) methane, IPCC AR6.
gwp100_biogenic_methane = 27.0


# =============================================================================
# LDPE  --  industry reference point
# =============================================================================
[[materials]]
id       = "ldpe"
name     = "LDPE"
role     = "Industry reference point"
summary  = "Low-density polyethylene. Fossil-derived, not biodegradable, the default barrier film in this product category."
# (C2H4)n : C 24.022 / MW 28.054
carbon_mass_fraction         = 0.8563
biogenic_carbon_mass_fraction = 0.0

[[materials.stages]]
id         = "raw_material"
label      = "Raw material + polymerisation"
value      = 1.80
low        = 1.70
high       = 2.00
confidence = "literature"
boundary   = "factory_gate"
source     = "PlasticsEurope eco-profile for LDPE resin, cradle-to-gate; commonly reported in the ~1.7-2.0 kg CO2e/kg range."
note       = "Naphtha cracking to ethylene plus polymerisation. European average grid and steam. PlasticsEurope's declared unit is 1 kg of UNPACKED resin at production site out, excluding packaging, use phase and end of life."

[[materials.stages]]
id         = "processing"
label      = "Processing (blown/cast extrusion)"
value      = 0.25
low        = 0.15
high       = 0.40
confidence = "estimate"
boundary   = "process"
source     = ""
note       = "Film extrusion energy at UK grid intensity. Not traced to a specific eco-profile; sensitive to line efficiency and grid year."

[[materials.eol_routes]]
id         = "incineration"
label      = "Incineration"
value      = 2.90
low        = 2.80
high       = 3.14
confidence = "literature"
boundary   = "eol"
source     = "Near-total combustion of fossil carbon; widely reported ~2.9 kg CO2e/kg for PE."
note       = "Upper bound 3.14 is the stoichiometric maximum at 100% oxidation of 85.63% carbon. The 2.90 central value implies ~92% oxidation. No energy-recovery credit is taken, which is the conservative choice."

[[materials.eol_routes]]
id         = "landfill"
label      = "Landfill"
value      = 0.05
low        = 0.01
high       = 0.10
confidence = "estimate"
boundary   = "eol"
source     = ""
note       = "LDPE is largely inert on landfill timescales. Value covers site operations only. Carbon stays sequestered, which flatters LDPE on GWP alone and says nothing about persistence."


# =============================================================================
# PVA  --  the incumbent material
# =============================================================================
[[materials]]
id       = "pva"
name     = "PVA (polyvinyl alcohol)"
role     = "Incumbent material"
summary  = "Water-soluble polymer, made by hydrolysis of polyvinyl acetate rather than by polymerising a monomer. Fossil-derived but water-soluble and, contentiously, described as biodegradable."
# (C2H4O)n : C 24.022 / MW 44.053
carbon_mass_fraction         = 0.5453
biogenic_carbon_mass_fraction = 0.0

[[materials.stages]]
id         = "raw_material"
label      = "Raw material + hydrolysis of PVAc"
value      = 2.36
low        = 2.36
high       = 3.40
confidence = "literature"
boundary   = "factory_gate"
source     = "Kuraray, KURARAY POVAL(TM) life cycle assessment, 2024 update: 2.36 kg CO2e per kg PVOH, cradle-to-gate, Frankfurt production (2.47 in the preceding assessment)."
note       = "Central value is a single manufacturer's own site-specific LCA, so it is a best case rather than an industry average. Kuraray states the figure is ~30% below the PVOH average in a major LCI database, which implies a generic average near 3.4 -- used here as the upper bound. Range is therefore manufacturer-best to database-average, not a measurement uncertainty."

[[materials.stages]]
id         = "processing"
label      = "Processing (solution casting / extrusion)"
value      = 0.30
low        = 0.20
high       = 0.45
confidence = "estimate"
boundary   = "process"
source     = ""
note       = "Assumed comparable to other film-forming routes, slightly above LDPE extrusion because water must be driven off in solution casting."

[[materials.eol_routes]]
id         = "biodegradation"
label      = "End of life: biodegradation (aqueous)"
value      = 2.00
low        = 0.40
high       = 2.00
confidence = "derived"
boundary   = "eol"
derivation = "stoichiometric_full_oxidation"
source     = "Stoichiometry. Degradation EXTENT is contested: Rolsky & Kelkar, Int. J. Environ. Res. Public Health 2021, 18, 6027 (doi:10.3390/ijerph18116027) model only ~15-40% degradation in US wastewater treatment plants, implying most passes through; an industry-commissioned expert panel (SciPinion, 2024) and the American Cleaning Institute reject that model and conclude PVA is readily biodegradable."
note       = "CRITICAL: on this route a LOWER number is NOT better. The high value (2.00) is complete mineralisation of the fossil carbon. The low value (0.40) represents the Rolsky & Kelkar case where ~80% does not mineralise -- the GWP falls only because the polymer persists in the environment as fragments instead. GWP alone cannot rank this route; see the qualitative flag."

[[materials.eol_routes]]
id         = "incineration"
label      = "End of life: incineration"
value      = 2.00
low        = 1.84
high       = 2.00
confidence = "derived"
boundary   = "eol"
derivation = "stoichiometric_full_oxidation"
source     = "Stoichiometry: 54.53% carbon x 44.009/12.011."
note       = "Low bound assumes 92% oxidation, matching the oxidation efficiency implied by the LDPE incineration figure."

[[materials.eol_routes]]
id         = "landfill"
label      = "End of life: landfill"
value      = 0.10
low        = 0.02
high       = 0.30
confidence = "estimate"
boundary   = "eol"
source     = ""
note       = "Slow anaerobic degradation with some methane generation, partially captured. Not source-traced."

[[materials.qualitative_flags]]
severity = "high"
topic    = "Microplastic persistence"
text     = "PVA passes OECD 301 biodegradability screening, but that test does not establish the fate of the polymer in real wastewater treatment or in soil. There is published evidence of persistent fragments. This is a real impact that carries NO GWP number and is therefore invisible in every total in this model. Do not read a low PVA end-of-life figure as an environmental win."


# =============================================================================
# BIOMATERIAL FILM  --  the proposed replacement
# =============================================================================
# Raw-material footprint is BUILT UP from the blend components below, so the
# formulation can be changed here without touching any calculation code.
#
# READ THE BOUNDARY WARNING. The alginate and stearic acid central values come
# from a FOOD-ingredient database whose boundary runs to the retail shelf and
# includes packaging, storage and land-use change. The LDPE and PVA figures they
# are compared against are unpacked-resin-at-factory-gate eco-profiles. That
# mismatch inflates this material. Use --scenario harmonised_boundary for the
# like-for-like comparison.
# =============================================================================
[[materials]]
id       = "biofilm"
name     = "Biomaterial film (alginate / zein / stearic acid)"
role     = "Proposed replacement"
summary  = "Solvent-cast and dehydrated film from sodium alginate, zein and stearic acid. All three components are biogenic, so the film carries a biogenic carbon credit at uptake and returns that carbon at end of life."

[[materials.composition]]
id               = "alginate"
component        = "Sodium alginate"
mass_fraction    = 0.60
frac_confidence  = "placeholder"
frac_note        = "Formulation ratio is reconstructed, not measured. The original 2023 recipe is unavailable. Alginate is assumed the film former and majority component."
# (C6H7NaO6)n : C 72.066 / MW 198.106
carbon_mass_fraction = 0.3638
biogenic             = true
value      = 21.29
low        = 20.80
high       = 21.30
confidence = "literature"
boundary   = "retail_shelf"
source     = "CarbonCloud ClimateHub product report, sodium alginate (E401): 21.29 kg CO2e/kg, cradle to retail shelf."
note       = "Range is the agreement between the only TWO sources that measure purified alginate: CarbonCloud 21.29, and a seaweed-biorefinery LCA giving ~20.8 kg CO2e/kg (7042.7 kg CO2e per tonne dry seaweed yielding 338 kg alginate). READ THE RANGE CORRECTLY: 20.80-21.30 means those two sources agree, NOT that alginate is known to within 2%. Everything that actually makes this number uncertain -- extraction yield, biorefinery co-product allocation, and the retail-shelf boundary -- is listed under `unquantified` below because none of it can be given a defensible number from the sources found. The 4.00-5.90 Sargassum figure previously used as the lower bound has been moved to a scope variant: it measures a composite bioplastic, not alginate, and was making a product mismatch look like uncertainty. BOUNDARY: CarbonCloud runs from agricultural inputs to the retail shelf including packaging, storage and deforestation, so 21.29 is biased HIGH against the factory-gate polymer eco-profiles; direction known, size not."
unquantified = [
  "Extraction yield. The biorefinery figure states 338 kg alginate per tonne dry seaweed (33.8%). Alginate content varies by species, season and extraction route, and both alginate LCAs found name yield as a main hotspot. Per-kg footprint scales inversely with yield, so a yield half as good doubles this number. No sourced yield range was found, so this is not in low/high.",
  "Co-product allocation. The ~20.8 corroborating figure assigns 100% of a multi-output biorefinery (food, materials AND energy from one tonne of seaweed) to the alginate stream. That was this model's choice, not the study's. Under any co-product allocation the alginate share falls, by an amount that depends entirely on the allocation basis chosen.",
  "Retail-shelf to factory-gate correction. Removing packaging, storage, retail transport and land-use change would lower 21.29 by an unknown amount. The boundary audit flags the direction; no source found lets the size be quantified.",
  "Purification depth. Food-grade E401 is purified to a specification a film former may not need. Purification is named as a main hotspot, so a technical-grade alginate could sit materially lower.",
]

[[materials.composition.scope_variants]]
id         = "sargassum_composite_bioplastic"
label      = "Sargassum calcium alginate composite bioplastic"
value      = 4.00
low        = 4.00
high       = 5.90
confidence = "literature"
comparable = false
product    = "Calcium alginate COMPOSITE BIOPLASTIC -- a finished blended film, not isolated sodium alginate. The alginate mass fraction of the composite is not established here."
feedstock  = "Sargassum. UNVERIFIED INFERENCE: Sargassum valorisation studies typically use beach-cast or bloom biomass, a nuisance stream that under cut-off allocation carries little or no upstream burden. If so, a large part of the gap to 21.29 is allocation convention rather than process efficiency. The paper could not be retrieved to confirm this."
includes   = "Gate-to-gate extraction."
excludes   = "Per the convention these studies report, drying, milling, equipment manufacture and transport are commonly excluded for consistency with prior work. Seaweed DRYING is separately named as one of the two main hotspots in seaweed LCAs, so this exclusion may omit a hotspot."
why_not_comparable = "It measures a different product (a finished composite film, not purified alginate), from a different feedstock class (waste vs cultivated), on a narrower boundary, and would sit in the blend as an ingredient when it is already a film. Used as a lower bound it made a four-way scope mismatch look like a single uncertainty range."
source     = "RSC Green Chem., 2023, 25, 5501: composite calcium alginate bioplastics derived from Sargassum, 4-5.9 kg CO2e/kg bioplastic."
note       = "Kept visible because it is the only low figure in the alginate literature found, and a reader should see it -- but it cannot bound this input."

[[materials.composition.scope_variants]]
id         = "alginate_composite_films_multiple"
label      = "Alginate composite films, as a multiple of PLA/PET"
value      = 13.50
low        = 7.00
high       = 20.00
confidence = "literature"
comparable = false
product    = "Alginate COMPOSITE FILMS, not isolated alginate."
feedstock  = "Not stated in the retrieved summary."
includes   = "Cradle-to-gate; impacts attributed mainly to chemical consumption in extraction."
excludes   = "Not stated."
why_not_comparable = "Reported only as a ratio (3-7x PLA and PET), so the absolute value depends on which PLA/PET figure it is multiplied by; and it measures a composite film rather than the alginate ingredient. Useful as directional corroboration that alginate extraction is chemical-intensive, not as a number."
source     = "Reported as 3-7x the impact of PLA and PET films; converted here using PLA/PET at roughly 2-3 kg CO2e/kg."
note       = "Directional support that purified alginate belongs in the high single figures to low twenties, not at 4."

[[materials.composition]]
id               = "zein"
component        = "Zein"
mass_fraction    = 0.30
frac_confidence  = "placeholder"
frac_note        = "Reconstructed formulation ratio, not measured."
carbon_mass_fraction = 0.5300
biogenic             = true
value      = 3.00
low        = 1.00
high       = 8.00
confidence = "placeholder"
boundary   = "factory_gate"
source     = "NO INDUSTRIAL FIGURE FOUND. This is a proxy, not a measurement."
note       = "PROXY: zein is a co-product of corn milling, whose corn-derived streams sit near 0.65-1.75 kg CO2e/kg (CarbonCloud corn starch/flour reports), uplifted for the ethanol extraction and drying needed to isolate zein. The 1.00-8.00 range is ENGINEERING JUDGEMENT for an industrial process with solvent recovery, not a measured or sourced spread -- which is exactly why the tag is `placeholder` and stays that way. The 760 and 5300 lab-scale figures previously used as the upper bound have been moved to a scope variant: they are an accurate measurement of a LABORATORY SOLVENT INVENTORY, not a high estimate of zein, and carrying them in the range put a 239 kg CO2e/kg span on this input that made the sensitivity ranking meaningless."
unquantified = [
  "Scale-up factor from laboratory to industrial extraction. The only published zein LCA is lab-scale and solvent-dominated; the gap to an industrial process with closed-loop solvent recovery is orders of magnitude and cannot be estimated from the retrieved summary.",
  "Co-product allocation of the corn burden. Zein is a minor fraction of corn gluten meal or DDGS, which are themselves co-products of starch or ethanol production. Whether zein carries a share of corn farming (mass or economic allocation) or none at all (residue treated as cut-off) changes the upstream contribution substantially -- though at any industrial figure this is a smaller effect than the scale-up factor.",
  "Feedstock route. Zein from wet-mill corn gluten meal and zein from dry-mill DDGS are different processes with different yields and purities.",
]

[[materials.composition.scope_variants]]
id         = "lab_scale_solvent_extraction"
label      = "Lab-scale solvent extraction of zein (two routes)"
value      = 760.00
low        = 760.00
high       = 5300.00
confidence = "literature"
comparable = false
product    = "1 kg of zein -- the SAME functional unit as the input above. The divergence is not a boundary or functional-unit mismatch."
feedstock  = "DDGS (dry-mill ethanol residue)."
includes   = "Cradle-to-gate laboratory extraction. Impacts overwhelmingly dominated by solvent use; the study's own variables include the solvent management method, i.e. whether solvent is recovered."
excludes   = "Any industrial solvent recovery loop."
why_not_comparable = "This is a technology-readiness mismatch, not a scope one. At 760+ essentially the whole figure is laboratory solvent; the corn upstream (at most ~2) is under 0.3% of it. It is an accurate measurement of a bench process and says nothing about an industrial one. Carried as a bound it implied a 239 kg CO2e/kg uncertainty on a 3.00 input."
source     = "RSC Green Chem., 2026, 'Life cycle assessment of zein, ethyl lactate, and derivative nanofiltration membranes': 760 and 5300 kg CO2e per kg zein for two lab-scale extraction scenarios."
note       = "The most useful thing this paper gives us is not a number but a hotspot: extraction solvent dominates, so any industrial figure hinges on recovery rate."

[[materials.composition]]
id               = "stearic_acid"
component        = "Stearic acid"
mass_fraction    = 0.10
frac_confidence  = "placeholder"
frac_note        = "Reconstructed formulation ratio, not measured. Acts as plasticiser / hydrophobic modifier."
# C18H36O2 : C 216.198 / MW 284.484
carbon_mass_fraction = 0.7600
biogenic             = true
value      = 4.30
low        = 3.40
high       = 5.30
confidence = "derived"
boundary   = "factory_gate"
derivation = "bracketed_palm_oleochemical_chain"
source     = "Bracketed between two published cradle-to-gate figures on the palm oleochemical chain. LOWER anchor: RSPO-certified crude palm oil 3.41 kg CO2e/kg (non-certified 5.34) -- the feedstock before any oleochemical conversion. UPPER anchor: palm-kernel-oil-derived fatty alcohol 5.27 kg CO2e/kg, cradle-to-gate, land-use-change dominated (Shah, Arslan, Cirucci et al., J. Surfactants Deterg. 2016, 19, 1333-1351, doi:10.1007/s11743-016-1867-y; the same paper puts petrochemical fatty alcohol at 2.97). Corroborating low-end point on the same chain: distilled monoglycerides from palm fatty acid distillate at 1.33 kg CO2e/kg."
note       = "DERIVED BY INTERPOLATION, not a measured stearic acid figure. Stearic acid sits between the two anchors on the process chain: it is crude palm/palm kernel oil plus splitting, fractionation and hydrogenation, whereas fatty alcohol is that same route plus methyl esterification and a further hydrogenation. So stearic acid must cost more than the feedstock (3.41) and less than the fatty alcohol one step downstream (5.27); 4.30 is the midpoint of that bracket. THE INTENDED SOURCE IS THE ECOINVENT 'stearic acid production' DATASET, which exists in ecoinvent v3.6 through v3.10 but could not be retrieved: Climatiq, which indexes it, is contractually barred from publishing raw ecoinvent factors, and the ecoinvent portal requires a licence. Replace this with the ecoinvent value if you have database access -- that is a five-minute job and it is the single easiest upgrade left in this model. Tallow-derived stearic acid would sit elsewhere entirely depending on the allocation taken against the meat co-product."

[[materials.stages]]
id         = "processing"
label      = "Processing (solution casting + dehydration)"
value      = 0.30
low        = 0.20
high       = 0.60
confidence = "estimate"
boundary   = "process"
source     = ""
note       = "Comparable to other solvent-cast film processes. Upper bound allows for the high water load of an alginate casting solution; dehydration energy scales with solids content, which is unknown here."

[[materials.eol_routes]]
id         = "composting"
label      = "End of life: industrial composting"
value      = 0.10
low        = 0.05
high       = 0.20
confidence = "estimate"
boundary   = "eol"
source     = "Composting operations energy only. Carbon release is modelled separately from carbon content, see the fractions below."
note       = "`value` is fossil CO2e from collection and site operations. The biogenic carbon released is computed by the model from the blend's carbon content, so it always mirrors the biogenic credit and cannot drift out of step with it."
biogenic_carbon_released_fraction = 0.95
methane_share_of_released_carbon  = 0.02
methane_capture_rate              = 0.0
release_confidence = "literature"
release_source     = "95% release of stored carbon under industrial composting follows the assumption used by Patel et al. (2018) and repeated across compostable-plastic LCAs; the residual ~5% is retained in compost as stabilised carbon."
release_note       = "2% of released carbon as CH4 represents anaerobic pockets in an otherwise aerobic windrow; uncaptured. Biogenic CH4 valued at GWP100 = 27."

[[materials.eol_routes]]
id         = "landfill"
label      = "End of life: landfill"
value      = 0.05
low        = 0.02
high       = 0.10
confidence = "estimate"
boundary   = "eol"
source     = ""
note       = "Site operations only; the methane burden is computed from carbon content below."
biogenic_carbon_released_fraction = 0.50
methane_share_of_released_carbon  = 0.50
methane_capture_rate              = 0.60
release_confidence = "estimate"
release_source     = ""
release_note       = "Half the carbon degrades on a 100-year horizon, half of that anaerobically to CH4, 60% of which is captured and flared at a modern engineered site. Every one of those three numbers is a typical value, not a measured one -- landfill is the least certain route in the model and the most sensitive to capture rate."

[[materials.eol_routes]]
id         = "incineration"
label      = "End of life: incineration"
value      = 0.05
low        = 0.02
high       = 0.10
confidence = "estimate"
boundary   = "eol"
source     = ""
note       = "Fossil CO2e from plant operations only. All biogenic carbon is released as CO2, computed from carbon content."
biogenic_carbon_released_fraction = 1.00
methane_share_of_released_carbon  = 0.0
methane_capture_rate              = 0.0
release_confidence = "derived"
release_source     = "Complete oxidation."
release_note       = ""

[[materials.qualitative_flags]]
severity = "high"
topic    = "Raw-material figures sit on a wider boundary than the materials they are compared with"
text     = "Alginate and stearic acid central values are food-ingredient figures running to the retail shelf and including packaging, storage and land-use change. LDPE and PVA are unpacked-resin-at-factory-gate eco-profiles. The default scenario therefore OVERSTATES the biomaterial by an unknown amount. Run --scenario harmonised_boundary to see the like-for-like comparison, and treat the gap between the two as a measure of how much this sourcing problem matters."

[[materials.qualitative_flags]]
severity = "medium"
topic    = "Formulation is reconstructed"
text     = "All three blend ratios are placeholders. Because the component footprints differ by a factor of ~7 (alginate 21.29 vs zein proxy 3.00), the blend ratio is not a detail -- it moves the raw-material total materially. Replace with the real recipe before quoting any number from this model."

[[materials.qualitative_flags]]
severity = "medium"
topic    = "Seaweed sequestration not credited"
text     = "Only the carbon embodied in the film itself is credited. Any wider blue-carbon or nutrient-remediation benefit from seaweed cultivation is excluded, as is any land-use-change burden from the palm-derived stearic acid beyond what the source figure already contains."


# =============================================================================
# SCENARIOS
# =============================================================================
# Named override sets. Each override addresses one input by path:
#   <material_id>/stage/<stage_id>
#   <material_id>/component/<component_id>
#   <material_id>/eol/<route_id>
# Add or edit scenarios here; no code change is needed.
# =============================================================================

[scenarios.default]
label       = "As sourced"
description = "Every value as sourced. One known boundary mismatch remains, on alginate, which overstates the biomaterial film by an unquantified amount. Stearic acid was on the same footing until it was replaced with a factory-gate figure."

# NOTE: a `harmonised_boundary` scenario was REMOVED here.
# It substituted the Sargassum figure (4.00) for alginate and presented the
# result as the like-for-like comparison. That was wrong: 4.00 measures a
# finished composite bioplastic from a different feedstock class on a narrower
# boundary, so the scenario was a product mismatch dressed as a boundary
# correction. Stearic acid, the other half of that scenario, is now a
# factory-gate figure by default and needs no override. No honest harmonised
# scenario can be built for alginate until a factory-gate purified-alginate
# figure exists -- the correction is real but its SIZE is unknown, and inventing
# one would reintroduce exactly the error this model exists to catch.
# The Sargassum figure is still reachable, as a declared scope variant, below.

[scenarios.sargassum_route]
label       = "Sargassum composite route (NOT comparable)"
description = "Swaps in the Sargassum calcium alginate composite bioplastic figure by pulling the declared scope variant. This is NOT a like-for-like comparison and must not be read as one: it measures a finished composite film rather than purified alginate, from a waste-class feedstock, on a boundary that commonly excludes seaweed drying. It exists so the only low figure in the alginate literature stays visible and testable, and so the size of the product mismatch is on screen rather than buried in a note."

[[scenarios.sargassum_route.overrides]]
path    = "biofilm/component/alginate"
variant = "sargassum_composite_bioplastic"


[scenarios.zein_resolved]
label       = "Zein resolved (illustrative)"
description = "What the model would say if the zein placeholder were replaced by a sourced figure. Applied on top of nothing else, so it isolates the effect of closing the single largest uncertainty. The value itself is INVENTED for illustration and must never be quoted."

[[scenarios.zein_resolved.overrides]]
path       = "biofilm/component/zein"
value      = 2.50
low        = 2.00
high       = 3.20
confidence = "placeholder"
boundary   = "factory_gate"
source     = "ILLUSTRATIVE ONLY -- not a real figure. Kept tagged as a placeholder so the flag never comes off."
note       = "Deliberately left as a placeholder tag. The point of this scenario is to show how much the RANGE collapses when the weakest input is closed, not to pretend the input has been closed."

[scenarios.food_database_sourcing]
label       = "Food-database sourcing (boundary mismatch, for contrast)"
description = "Restores the CarbonCloud food-ingredient figures for BOTH bio components. Their boundary runs to the retail shelf and includes packaging, storage and land-use change, so this scenario is NOT like-for-like with the polymer eco-profiles. It exists to show how much the sourcing decision moves the answer -- run it against 'default' and read the gap as the size of the boundary problem, not as a range of plausible values."

[[scenarios.food_database_sourcing.overrides]]
path       = "biofilm/component/stearic_acid"
value      = 11.20
