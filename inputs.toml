[[materials.qualitative_flags]]
severity = "high"
topic    = "Raw-material figures sit on a wider boundary than the materials they are compared with"
text     = "The alginate central value is a food-ingredient figure running to the retail shelf and including packaging, storage and land-use change. LDPE and PVA are unpacked-resin-at-factory-gate eco-profiles. The default scenario therefore OVERSTATES the biomaterial by an unknown amount. Stearic acid carried the same mismatch until a factory-gate figure replaced it; alginate cannot be corrected that way, because the correction is real but its SIZE is unknown and inventing one would reintroduce the error. There is deliberately no harmonised scenario. Run --boundaries for the audit."

