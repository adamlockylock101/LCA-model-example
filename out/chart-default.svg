<text class="t-sub" x="24" y="54">Cradle-to-grave kg CO2e per kg of film material. Bars are central values; whiskers span the input ranges.</text>
<text class="t-sub" x="24" y="72">Scenario: <tspan font-weight="600">As sourced</tspan></text>
<text class="t-alert" x="24" y="92">Hatched bars with a red outline are PLACEHOLDER-BASED: at least one input has no source. Not comparable at face value.</text>
